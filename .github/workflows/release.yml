name: release

# Build the image on every vX.Y.Z tag. Push to Docker Hub when the
# DOCKERHUB_* secrets exist; otherwise build-only (verifies the Dockerfile)
# and skip the push — no failure before Docker Hub is wired.
on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        id: login
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            vezril/ai-toolkit-ui:${{ steps.v.outputs.version }}
            vezril/ai-toolkit-ui:latest

      - name: Note when push skipped
        if: ${{ secrets.DOCKERHUB_USERNAME == '' }}
        run: echo "::notice::Built ok; push skipped (no DOCKERHUB_USERNAME secret). Run dockerhub-setup to enable publishing."
