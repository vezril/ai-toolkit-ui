name: release

# Build the image on every vX.Y.Z tag. Push to Docker Hub when the
# DOCKERHUB_* secrets exist; otherwise build-only (verifies the Dockerfile)
# and skip the push — no failure before Docker Hub is wired.
on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version and push flag
        id: cfg
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DOCKERHUB_USERNAME secret — building only, push skipped. Run dockerhub-setup to enable publishing."
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: |
            calvinference/ai-toolkit-ui:${{ steps.cfg.outputs.version }}
            calvinference/ai-toolkit-ui:latest
